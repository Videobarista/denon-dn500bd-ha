name: Ruff

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  ruff:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ruff is downloaded by the pinned action and verified against its
      # SHA-256 (x86_64 Linux build of the version below).
      - name: Lint
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.3"
          checksum: 2b0890f5a55900af741f133918c2656919bbf18c2ab7741b4ca8403a90e647a9
          args: check
      - name: Format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.3"
          checksum: 2b0890f5a55900af741f133918c2656919bbf18c2ab7741b4ca8403a90e647a9
          args: format --check
